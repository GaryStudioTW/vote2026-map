<style>/* Leaflet 1.9.4 */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,

	}

	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,

	}

}

.leaflet-safari .leaflet-tile {

	}

.leaflet-safari .leaflet-tile-container {

	}

.leaflet-marker-shadow {

.leaflet-container .leaflet-tile-pane img,

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

}

	-ms-touch-action: none;
	touch-action: none;

}

	}

	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;

	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {

.leaflet-bottom .leaflet-control {

	}

	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);

.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {

.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

.leaflet-container {

	}
.leaflet-zoom-box {

/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;

.leaflet-bar a,
.leaflet-control-layers-toggle {

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;

	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {

	}

.leaflet-touch .leaflet-bar a {

	}

/* Default icon URLs */

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

.leaflet-popup {

	}
.leaflet-popup-content-wrapper {

.leaflet-popup-tip-container {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

	}
.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

/* div icon */

.leaflet-div-icon {
	background: #fff;

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

	margin-bottom: -12px;

}
.leaflet-tooltip-left:before,

<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --ink:#1a1f2b; --sub:#5b6472; --line:#e6e9ef;
    --brand:#2b5cff; --brand-soft:#eef3ff; --shadow:0 6px 24px rgba(20,30,60,.12);
    --kmt:#000095; --dpp:#1b9431; --tpp:#28c8c8; --npp:#fbbb13; --tsp:#a73f24; --none:#8a94a6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1200;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  header .logo{font-weight:800;font-size:16px;letter-spacing:.5px;white-space:nowrap}
  header .crumb{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
  header .crumb b{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  header .crumb a{color:var(--brand);cursor:pointer;text-decoration:none}
  header .crumb a:hover{text-decoration:underline}
  header .crumb i{font-style:normal;color:#b3bac6}
  /* 選舉倒數 */
  .cd{flex:0 0 auto;position:relative;border:none;border-radius:999px;background:var(--brand);color:#fff;font-size:12.5px;padding:5px 11px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .cd b{font-size:15px;margin:0 2px;font-variant-numeric:tabular-nums}
  .cd.hot{background:#e8590c}
  .cd.done{background:#8a94a6}
  .cdtip{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#1a1f2b;color:#fff;font-size:12.5px;line-height:1.6;text-align:left;padding:8px 12px;border-radius:10px;box-shadow:var(--shadow);z-index:1300}
  .cd.open .cdtip{display:block}
  .cd.onmap{display:none;position:absolute;top:10px;right:10px;z-index:820;box-shadow:0 2px 10px rgba(20,30,60,.2)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:default}
  #main{flex:1;position:relative;min-height:0}
  #map{position:absolute;inset:0;background:#dfe6ee}
  .hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(26,31,43,.82);color:#fff;font-size:13px;padding:7px 14px;border-radius:20px;z-index:800;pointer-events:none;transition:opacity .3s;white-space:nowrap}
  .tlabel{background:transparent;border:none;box-shadow:none;padding:0;font-size:12px;font-weight:700;color:#1a1f2b;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
  .tlabel:before{display:none}
  /* 行政區／村里按鈕列 */
  #bars{position:absolute;left:56px;right:10px;top:10px;z-index:800;display:flex;flex-direction:column;gap:6px;pointer-events:none;transition:right .28s}
  #bars.hidden,.row.hidden{display:none}
  .row{pointer-events:auto;align-self:flex-start;max-width:100%;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #d3ddf5;border-radius:22px;padding:4px;box-shadow:0 2px 10px rgba(20,30,60,.13)}
  .rowlab{flex:0 0 auto;background:var(--brand);color:#fff;font-size:12px;font-weight:700;border-radius:16px;padding:5px 10px}
  .row.nudge .rowlab{animation:nudge 1.6s ease-out infinite}
  @keyframes nudge{0%{box-shadow:0 0 0 0 rgba(43,92,255,.55)}70%{box-shadow:0 0 0 8px rgba(43,92,255,0)}100%{box-shadow:0 0 0 0 rgba(43,92,255,0)}}
  .chips{display:flex;gap:5px;overflow-x:auto;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--brand-soft);border:1px solid #c9d6ff;color:#1f3fb8;border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{background:#dfe8ff}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
  .chip.part::after{content:'部分';font-size:10px;margin-left:3px;opacity:.75}
  .cgl{flex:0 0 auto;align-self:center;font-size:11px;font-weight:700;color:#5b6a82;padding:2px 2px 2px 8px;border-left:2px solid #c9d6ff;white-space:nowrap}
  #main.pop #bars{right:396px}
  /* 統一搜尋列（電腦：常駐標題列；手機：按 🔍 展開全寬） */
  .sbox{position:relative;flex:0 1 340px;min-width:220px;display:flex;align-items:center;gap:6px;background:#f3f5f9;border:1px solid var(--line);border-radius:10px;padding:0 8px;transition:.15s}
  .sbox:focus-within{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(43,92,255,.15)}
  .sbox .sic{font-size:13px;opacity:.65}
  .sbox input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:inherit;font-size:13.5px;padding:8px 0;color:var(--ink)}
  .sbox input::placeholder{color:#8a93a3}
  .sbox input::-webkit-search-cancel-button{display:none}
  .sbox .sx{display:none;border:none;background:#f0f2f6;width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px;flex:0 0 auto}
  .sres{display:none;position:absolute;left:0;top:calc(100% + 6px);width:max(100%,400px);max-height:min(70vh,540px);overflow-y:auto;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:1300;-webkit-overflow-scrolling:touch}
  .sbox.open .sres{display:block}
  .sbox.open .sres:empty{display:none} /* 還沒輸入時不顯示下拉 */
  .sres li{padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .sres li:hover,.sres li.act{background:var(--brand-soft)}
  .sres li .sn{font-weight:700;white-space:nowrap}
  .sres li small{color:var(--sub);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sres li .sno{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .sres li .sdot{flex:0 0 auto;width:4px;height:20px;border-radius:2px}
  .sres li.sh{font-size:11.5px;font-weight:800;color:var(--sub);cursor:default;padding:8px 10px 3px;letter-spacing:.5px}
  .sres li.sh:hover,.sres li.tip:hover,.sres li.more:hover{background:none}
  .sres li.tip,.sres li.more{display:block;font-size:12.5px;color:var(--sub);cursor:default;line-height:1.7}
  .sres li.tip b{color:var(--ink)}
  #sbtn{display:none}
  .cand.hit{animation:hit 2.6s ease-out}
  @keyframes hit{0%,35%{background:#fff3c4;border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.35)}100%{background:#fff}}
  .nbsel{font-size:13px;margin:2px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nbsel select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
  /* panel */
  #panel{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--panel);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:1000;display:flex;flex-direction:column}
  #panel.open{transform:none}
  .ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative;background:#fff}
  .ph .li{font-size:19px;font-weight:800}
  .ph .loc{font-size:12.5px;color:var(--sub);margin-top:2px}
  .ph .x{position:absolute;right:12px;top:12px;border:none;background:#f0f2f6;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--sub)}
  .ph .peek{display:none;font-size:12px;color:var(--brand);font-weight:700;margin-top:5px}
  .grab{display:none;justify-content:center;padding:8px 0 2px;background:#fff;cursor:grab;touch-action:none}
  .grab span{width:40px;height:5px;border-radius:3px;background:#d0d5de}
  #popen{position:absolute;right:10px;top:10px;z-index:850;display:none;border:none;background:var(--ink);color:#fff;font-family:inherit;font-size:13px;font-weight:700;border-radius:18px;padding:8px 14px;box-shadow:var(--shadow);cursor:pointer}
  #popen.show{display:block}
  .note{font-size:12px;color:var(--sub);background:#f6f7fa;border-radius:8px;padding:7px 10px;margin-bottom:8px}
  .office .part{font-size:10.5px;color:#fff;background:#8a94a6;border-radius:8px;padding:1px 6px}
  .pbody{flex:1;overflow-y:auto;padding:12px 16px 30px;-webkit-overflow-scrolling:touch}
  /* party filter（釘在面板上方，不跟著捲動） */
  .pfw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:#fafbfc}
  .pfw:empty{display:none}
  .pflab{font-size:11.5px;color:var(--sub);font-weight:700;flex:0 0 auto}
  .pf{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit;color:var(--ink)}
  .pf .dot{width:9px;height:9px;border-radius:50%}
  .pf.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .pf.dim{opacity:.45}
  /* 職務分組 */
  .grp{margin:18px 0 8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--gc);letter-spacing:.5px}
  .g:first-child .grp{margin-top:2px}
  .grp::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gc);flex:0 0 auto}
  .grp::after{content:"";flex:1;height:1px;background:var(--line)}
  .grp small{font-weight:400;color:var(--sub);font-size:11px;letter-spacing:0}
  .office{border:1px solid var(--line);border-top:3px solid var(--gc);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .office .oh{background:#f6f7fa;padding:7px 10px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .office .ot{font-size:14px;font-weight:800}
  .office .zone{font-size:11px;color:var(--sub)}
  .office .cnt{margin-left:auto;font-size:11px;color:var(--sub)}
  .office .ol{padding:0 8px 8px}
  .cand{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-top:6px;background:#fff}
  .cand .no{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .cand .bar{width:4px;align-self:stretch;border-radius:3px;min-height:26px}
  .cand .nm{font-weight:700;font-size:14px}
  .cand .zh{font-size:11px;color:var(--sub)}
  .cand .pt{margin-left:auto;font-size:11.5px;color:var(--sub);white-space:nowrap}
  .poll{display:block;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;text-decoration:none;color:var(--ink)}
  .poll:hover{border-color:var(--brand)}
  .poll.mine{border:2px solid #f5a623;background:#fff8ec}
  .poll .mineb{display:inline-block;font-size:11px;font-weight:700;background:#f5a623;color:#fff;border-radius:10px;padding:1px 8px;margin-bottom:4px}
  .poll .pn{font-weight:700;font-size:13.5px}
  .poll .pa{font-size:11.5px;color:var(--sub);margin-top:2px}
  .poll .pnb{font-size:11px;color:var(--brand);margin-top:3px}
  .poll .pgo{font-size:11.5px;color:var(--brand);margin-top:6px;font-weight:700}
  .empty{color:var(--sub);font-size:13px;padding:8px 0}
  footer{font-size:11px;color:var(--sub);text-align:center;padding:6px;background:var(--panel);border-top:1px solid var(--line);z-index:1200}
  .spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(247,248,250,.7);z-index:900;font-size:14px;color:var(--sub)}
  .spin.on{display:flex}
  @media(max-width:640px){
    /* 手機：bottom sheet（收合／半開／全開，用高度控制，內容區才能完整捲動） */
    #panel{top:auto;bottom:0;left:0;width:100%;max-width:100%;height:0;border-radius:16px 16px 0 0;transform:none;transition:height .28s cubic-bezier(.4,0,.2,1);overflow:hidden;visibility:hidden;box-shadow:0 -4px 24px rgba(20,30,60,.18)}
    #panel.open{transform:none;visibility:visible}
    .grab{display:flex}
    .ph{padding:4px 16px 10px;touch-action:none}
    .ph .x{top:4px}
    #panel[data-s=peek] .ph .peek{display:block}
    .hint{top:14px;bottom:auto}
    #bars{top:auto;bottom:calc(var(--sheet-h,0px) + 10px);left:10px;right:10px;transition:bottom .28s}
    #main.pop #bars{right:10px}
    #main[data-sheet=half] #bars,#main[data-sheet=full] #bars{display:none}
    #search{left:52px;right:10px;width:auto}
    #search select,#search .cbi{font-size:16px}
    #search .cbl li{font-size:15px;padding:9px 10px}
    header{gap:8px;padding:10px 12px}
    header .lbl{display:none}
    /* 手機：搜尋框收在 🔍 按鈕，展開時蓋在地圖上方 */
    #sbtn{display:inline-block}
    .sbox{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 6px);background:#fff;box-shadow:var(--shadow);border-radius:12px;padding:4px 6px 4px 10px;z-index:1300}
    .sbox.show{display:flex}
    .sbox input{font-size:16px}
    .sbox .sx{display:block}
    .sres{width:auto;right:0;max-height:60vh}
    /* 手機：倒數膠囊改放地圖右上角（候選人面板可以蓋過它） */
    header .cd{display:none}
    .cd.onmap{display:block}
    header .crumb .far{display:none}
    .pfw{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .pfw::-webkit-scrollbar{display:none}
    footer span{display:block}
    footer .dotsep{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">🗳️ 2026 選舉地圖</span>
    <span class="crumb" id="crumb">點選縣市或用搜尋開始</span>
    <div class="sbox" id="sbox">
      <span class="sic" aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="搜尋候選人、選區、行政區或地址" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-label="搜尋候選人或地區">
      <button class="sx" id="qclose" type="button" aria-label="關閉搜尋">✕</button>
      <ul class="sres" id="qres" role="listbox"></ul>
    </div>
    <button class="cd" type="button" aria-label="選舉倒數"></button>
    <button class="btn" id="sbtn" title="搜尋">🔍</button>
    <button class="btn" id="back" disabled title="上一層">←<span class="lbl"> 上一層</span></button>
  </header>
  <div id="main">
    <div id="map"></div>
    <button class="cd onmap" type="button" aria-label="選舉倒數"></button>
    <div id="bars" class="hidden">
      <div class="row" id="row_t"><span class="rowlab">行政區</span><div class="chips" id="chips_t"></div></div>
      <div class="row hidden" id="row_v"><span class="rowlab">村里</span><div class="chips" id="chips_v"></div></div>
    </div>
    <div class="hint" id="hint">點一個縣市</div>
    <div class="spin" id="spin">載入中…</div>
    <button id="popen">👤 候選人</button>
    <div id="panel">
      <div class="grab" id="p_grab"><span></span></div>
      <div class="ph" id="p_head">
        <button class="x" id="pclose" title="關閉">✕</button>
        <div class="li" id="p_li">—</div>
        <div class="loc" id="p_loc"></div>
        <div class="peek" id="p_peek"></div>
      </div>
      <div class="pfw" id="p_filter"></div>
      <div class="pbody" id="p_body"></div>
    </div>
  </div>
  <footer><span>資料來源：中央選舉委員會、內政部國土測繪中心、<a href="https://taiwanvotes.tw/" target="_blank" rel="noopener">視覺化速查選舉資料庫</a>（CC BY 4.0）</span><span class="dotsep">　·　</span><span>本站為資訊整理，非官方網站</span></footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const PARTY_COLORS={"中國國民黨":"#000095","民主進步黨":"#1b9431","台灣民眾黨":"#28c8c8","時代力量":"#fbbb13","台灣基進":"#a73f24","新黨":"#ffdb00","親民黨":"#ff6310","綠黨":"#8bc540","無":"#8a94a6"};
const partyColor=p=>PARTY_COLORS[p]|| "#6b7686";
const TOWN_COLORS=["#7cb5ec","#90ed7d","#f7a35c","#8085e9","#f15c80","#e4d354","#2b908f","#f45b5b","#91e8e1","#b39ddb","#ffb74d","#4db6ac"];
// 職務依層級分組（山地原住民區長／區民代表由全區選民投票，歸在鄉鎮市區層級）
const GROUPS=[
  {name:"縣市層級",color:"#2b5cff",offices:["直轄市長","縣市長","直轄市議員","縣市議員"]},
  {name:"鄉鎮市區層級",color:"#7c4dff",offices:["鄉鎮市長","山地原住民區長","鄉鎮市民代表","山地原住民區民代表"]},
  {name:"村里層級",color:"#e0772e",offices:["村里長"]},
  {name:"原住民選舉",sub:"依原住民身分別投票",color:"#b0457e",offices:["平地原住民議員","山地原住民議員","平地原住民代表"]},
];
const COUNTY_ORDER=["臺北市","新北市","桃園市","臺中市","臺南市","高雄市","基隆市","新竹市","嘉義市","新竹縣","苗栗縣","彰化縣","南投縣","雲林縣","嘉義縣","屏東縣","宜蘭縣","花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"];

const map=L.map('map',{zoomControl:true,attributionControl:false}).setView([23.7,120.9],7);
// 底圖：內政部國土測繪中心 台灣通用電子地圖（免費、免API金鑰、官方最準；頁尾已標註來源）
L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',{maxZoom:20,attribution:'© 內政部國土測繪中心'}).addTo(map);
// 圖層上下順序：縣市（底）→ 行政區 → 村里（上）
[['pCty',410],['pTwn',420],['pLi',430],['pZone',440]].forEach(([n,z])=>{map.createPane(n).style.zIndex=z;});
map.getPane('pZone').style.pointerEvents='none'; // 選區描邊只是標示，不擋住底下的里

// 縮放範圍：只框台灣本島＋主要離島（金門/馬祖/澎湖/蘭嶼/綠島），排除高雄轄下的南沙太平島、東沙島，
// 以免整張地圖被拉到南海。被排除的島嶼仍會畫在地圖上、仍可點選，只是不影響自動縮放範圍。
const TW_BOX=[[21.5,118.0],[26.6,122.6]]; // [南,西],[北,東]
function coreBounds(geojson){
  const b=L.latLngBounds([]);
  const inBox=(lat,lng)=>lat>=TW_BOX[0][0]&&lat<=TW_BOX[1][0]&&lng>=TW_BOX[0][1]&&lng<=TW_BOX[1][1];
  const walk=c=>{ if(typeof c[0]==='number'){ if(inBox(c[1],c[0]))b.extend([c[1],c[0]]); } else for(const x of c)walk(x); };
  for(const f of geojson.features) if(f.geometry) walk(f.geometry.coordinates);
  return b.isValid()?b:null;
}

const $=id=>document.getElementById(id);
const spin=on=>$('spin').classList.toggle('on',on);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMobile=()=>innerWidth<=640;
const mem={};
const store={get:k=>{try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}return mem[k];},set:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}}};

let level='tw',curC=null,curCounty=null,curData=null,curTown=null,curVc=null,curNb=null,curParties=null;
let countyLayer=null,twBounds=null,townLayer=null,liLayer=null,liColor={},navToken=0,hintTimer=null;
const cache={},loaded={};

function showHint(text,ms){
  const h=$('hint');h.textContent=text;h.style.opacity=1;clearTimeout(hintTimer);
  if(ms)hintTimer=setTimeout(()=>h.style.opacity=0,ms);
}
const hideHint=()=>{clearTimeout(hintTimer);$('hint').style.opacity=0;};

// ---- 縣市資料（快取；同一縣市只下載一次）----
function getCounty(name){
  if(!cache[name])cache[name]=fetch('data/'+encodeURIComponent(name)+'.json')
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(data=>{
      const topo=data.boundary,obj=topo.objects.lis;
      const geo=topojson.feature(topo,obj);
      const vbt={};
      for(const vc of Object.keys(data.lis))(vbt[data.lis[vc].town]||=[]).push(vc);
      for(const t in vbt)vbt[t].sort();
      const towns=Object.keys(vbt).sort((a,b)=>vbt[a][0]<vbt[b][0]?-1:1); // 依官方代碼順序
      const tColor={};towns.forEach((t,i)=>tColor[t]=TOWN_COLORS[i%TOWN_COLORS.length]);
      const townGeo={type:'FeatureCollection',features:towns.map(t=>{
        const gs=obj.geometries.filter(g=>g.properties.town===t);
        return gs.length?{type:'Feature',properties:{town:t},geometry:topojson.merge(topo,gs)}:null;
      }).filter(Boolean)};
      // 議員選舉區 → 行政區（行政區按鈕依選舉區分組；一區跨兩個選舉區的兩組都列、標「部分」）
      const council=[],cz={};
      for(const t of towns){
        const zs=new Set(vbt[t].map(vc=>(data.lis[vc].zones||{})['直轄市議員']||(data.lis[vc].zones||{})['縣市議員']).filter(Boolean));
        zs.forEach(z=>(cz[z]||=[]).push({t,part:zs.size>1}));
      }
      Object.keys(cz).sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).forEach(z=>council.push({label:z.replace(name,'').replace('選舉區','選區'),towns:cz[z]}));
      return loaded[name]={name,data,geo,vbt,towns,tColor,townGeo,council};
    })
    .catch(e=>{delete cache[name];throw e;});
  return cache[name];
}

// ---- 全台縣市（一直留在地圖上；進到縣市後，其他縣市變淡色，可直接點過去切換）----
function ctyStyle(n,hover){
  if(level==='tw')return hover?{color:'#fff',weight:1,opacity:1,fillColor:'#2b5cff',fillOpacity:.85}:{color:'#fff',weight:1,opacity:1,fillColor:'#c9d6e8',fillOpacity:.9};
  if(n===curCounty)return {opacity:0,fillOpacity:0};
  return hover?{color:'#2b5cff',weight:2,opacity:1,fillColor:'#2b5cff',fillOpacity:.3}:{color:'#5b6a82',weight:1.2,opacity:.9,fillColor:'#4a5870',fillOpacity:.22};
}
const restyleCounties=()=>countyLayer&&countyLayer.eachLayer(ly=>ly.setStyle(ctyStyle(ly.feature.properties.name,false)));

async function init(){
  spin(true);
  try{
    const topo=await fetch('data/_counties.json').then(r=>r.json());
    const geo=topojson.feature(topo,topo.objects.counties);
    countyLayer=L.geoJSON(geo,{pane:'pCty',style:f=>ctyStyle(f.properties.name,false),onEachFeature:(f,ly)=>{
      const n=f.properties.name;
      ly.on('mouseover',()=>{if(n!==curCounty)ly.setStyle(ctyStyle(n,true));});
      ly.on('mouseout',()=>ly.setStyle(ctyStyle(n,false)));
      ly.on('click',()=>{ly.closeTooltip();if(n!==curCounty)openCounty(n);});
      ly.bindTooltip(n,{sticky:true});
    }}).addTo(map);
    twBounds=coreBounds(geo)||countyLayer.getBounds();
  }catch(e){showHint('資料載入失敗，請重新整理再試');}
  spin(false);
  initSearch();
  goHome();

}

function goHome(){
  navToken++;clearLi();panelHidden=false;scope=null;setSheet('closed');
  level='tw';curC=curCounty=curData=curTown=null;

// ---- 縣市層級：顯示各行政區 ----
async function openCounty(name,{fit=true}={}){
  const tk=++navToken;spin(true);
  let C;
  try{C=await getCounty(name);}catch(e){if(tk===navToken){spin(false);showHint('資料載入失敗，請重新整理再試',4000);}return null;}
  if(tk!==navToken)return null;
  clearLi();closeSearch();
  curC=C;curCounty=name;curData=C.data;curTown=null;level='county';
  restyleCounties();drawTowns();drawLis();renderBars();updateCrumb();
  showScope('county');
  if(fit)fitTo(coreBounds(C.townGeo)||townLayer.getBounds(),{pad:10,maxZoom:14});
  showHint('點一個行政區',2600);
  spin(false);
  return C;
}
function backToCounty({fit=true}={}){
  if(!curC)return;
  clearLi();curTown=null;level='county';
  drawTowns();drawLis();renderBars();updateCrumb();
  showScope('county');
  if(fit)fitTo(coreBounds(curC.townGeo)||townLayer.getBounds(),{pad:10,maxZoom:14});
}
function twnStyle(t,hover){
  const col=curC.tColor[t];
  if(!curTown)return {color:'#fff',weight:1.5,opacity:1,fillColor:col,fillOpacity:hover?.95:.72};
  if(t===curTown)return {color:'#1a1f2b',weight:2.5,opacity:1,fillOpacity:0};
  return {color:'#fff',weight:1,opacity:1,fillColor:col,fillOpacity:hover?.5:.22};
}
function drawTowns(){
  if(townLayer)map.removeLayer(townLayer);
  townLayer=L.geoJSON(curC.townGeo,{pane:'pTwn',style:f=>twnStyle(f.properties.town,false),onEachFeature:(f,ly)=>{
    const t=f.properties.town;
    ly.on('mouseover',()=>{if(t!==curTown)ly.setStyle(twnStyle(t,true));});
    ly.on('mouseout',()=>ly.setStyle(twnStyle(t,false)));
    ly.on('click',()=>{if(t!==curTown)selectTown(t);});
    if(t!==curTown)ly.bindTooltip(t,{permanent:true,direction:'center',className:'tlabel'});
  }}).addTo(map);
}
function townBounds(t){return coreBounds({features:curC.geo.features.filter(f=>f.properties.town===t)});}

// ---- 行政區層級：顯示該區的村里 ----
function selectTown(t,{fit=true}={}){
  clearLi();unnudge('t');
  curTown=t;level='town';

function liStyle(vc,hover){

function drawLis(){

// ---- 行政區／村里按鈕列（第一次使用時標籤會輕微閃動提示，點過就停）----

// ---- 里 詳情面板 ----
// 投票鄰別字串 → [[起,迄],…]；「全里」或里名 → null（代表整個里）
function parseNb(s){
  const t=String(s||'').normalize('NFKC').replace(/[~～－—–]/g,'-').replace(/[、.，,；;\s]+/g,',').replace(/^,|,$/g,'');
  if(!t||!/^[\d,\-]+$/.test(t))return null;
  const r=[];
  for(const part of t.split(',')){const [a,b]=part.split('-').map(Number);if(a)r.push([a,b||a]);}
  return r.length?r:null;
}
function openLi(vc,opt={}){
  const li=curData&&curData.lis[vc];if(!li)return;
  clearZone();
  if(li.town!==curTown)selectTown(li.town,{fit:!opt.fit});
  curVc=vc;curNb=opt.nb||null;unnudge('v');hideHint();
  refreshLiStyles();renderBars();updateCrumb();
  showScope('li');
  let b=null;
  if(liLayer)liLayer.eachLayer(ly=>{if(ly.feature.properties.vc===vc)b=ly.getBounds();});
  if(opt.fit)fitTo(b||townBounds(li.town),{pad:30});
  else if(b&&isMobile())keepVisible(b); // 面板升起後，點的里如果被蓋住就把地圖往上推
  if(li.nogeo)showHint('2026 新設的里，地圖還沒有界線',3200);
}
function clearLi(){curVc=null;curNb=null;clearZone();}
function leaveLi(){clearLi();refreshLiStyles();renderBars();updateCrumb();showScope('town');}

// ---- 候選人面板：依層級顯示（縣市 → 行政區 → 里，逐層增加）----
// 某職務在這一層的所有里都屬於同一個選區才顯示；選區不同就提示往下一層點
const COUNCIL=new Set(['直轄市議員','縣市議員']);
const NEXT={county:'行政區',town:'村里'};
const nextOf=()=>scope.kind==='zone'?(curZone.towns.length>1?'行政區':'村里'):NEXT[scope.kind];
let scope=null,panelHidden=false,sheetWant=null; // sheetWant：搜尋候選人時先指定面板要開到哪一段（地圖縮放才會避開面板）
function scopeOf(kind){
  const vcs=kind==='county'?Object.keys(curData.lis):kind==='town'?(curC.vbt[curTown]||[]):kind==='zone'?curZone.vcs:[curVc];
  const pop=vcs.filter(vc=>Object.keys(curData.lis[vc].zones||{}).length); // 排除無人居住的小島等
  const zones={},split={};
  GROUPS.forEach(g=>g.offices.forEach(off=>{
    const set=new Set();let has=0;
    pop.forEach(vc=>{const z=curData.lis[vc].zones[off];if(z){has++;set.add(z);}});
    if(set.size===1&&has===pop.length)zones[off]=[...set][0];
    else if(set.size>1)split[off]=[...set].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
    // 只有部分里有的職務（例如山地原住民區長）→ 到下一層才顯示
  }));
  return {kind,zones,split};
}
// 這一層要顯示的選區卡片；新竹市東區、北區、竹北市這種一區跨兩個議員選區的，兩個都列並標「本區部分里」
// 候選人（out＝號次公告時已不在名單：資格不符或退選；stop＝選區停止選舉 → 都不顯示）
const candsIn=zn=>(curData.byDistrict[zn]||[]).filter(c=>!c.out&&!c.stop);
function officeList(off){
  if(!scope)return [];
  const zn=scope.zones[off];
  if(zn)return [{zn,cs:candsIn(zn)}];
  const sp=scope.split[off];
  if(sp&&scope.kind==='town'&&COUNCIL.has(off)&&sp.length<=3)return sp.map(z=>({zn:z,cs:candsIn(z),partial:true}));
  // 議員選區跨好幾個鄉鎮：每個鄉鎮市長都列（例：雲林縣第1選區＝斗六市長、林內鄉長、莿桐鄉長）
  if(sp&&scope.kind==='zone'&&/鄉鎮市長|區長/.test(off))return sp.map(z=>({zn:z,cs:candsIn(z)}));
  return [];
}
function splitNote(off,n){
  const what=/鄉鎮市長|區長/.test(off)?'各行政區不同':off==='村里長'?'各村里不同':`分 ${n} 個選區`;
  return `<div class="note">${off}：${what}，點選${nextOf()}查看</div>`;
}
function showScope(kind,{state}={}){
  scope=scopeOf(kind);curParties=null;
  if(kind==='county'){$('p_li').textContent=curCounty;$('p_loc').textContent='縣市層級候選人';}
  else if(kind==='town'){$('p_li').textContent=curTown;$('p_loc').textContent=curCounty+'・行政區層級候選人';}
  else if(kind==='zone'){$('p_li').textContent=zoneTitle(curZone);$('p_loc').textContent=COUNCIL.has(curZone.off)?'議員選區・'+curZone.towns.join('、'):curCounty+' '+curZone.towns.join('、')+'・'+curZone.vcs.length+' 個村里';}
  else{const li=curData.lis[curVc];$('p_li').textContent=li.vill||'（無名稱里別）';$('p_loc').textContent=curCounty+' '+li.town;}
  renderFilter();renderPanel();
  $('p_body').scrollTop=0; // 換層級／換里時回到最上面
  panelHidden=false;
  // 手機：縣市、行政區只開到「收合」，地圖保持可點；點到里才開到半開（原本是全開就維持全開）
  setSheet(state||sheetWant||(kind==='li'?(sheet==='full'?'full':'half'):'peek'));
}

// ---- 面板開合：手機為 bottom sheet（peek 收合／half 半開／full 全開），電腦為右側欄 ----
let sheet='closed';
function peekH(){return $('p_grab').offsetHeight+$('p_head').offsetHeight;}
function sheetH(s){
  const H=$('main').clientHeight;
  return s==='peek'?Math.min(peekH(),H):s==='half'?Math.round(H*.55):s==='full'?H:0;
}
function setSheet(s,{animate=true}={}){
  sheet=s;
  const p=$('panel'),m=$('main'),open=s!=='closed';
  p.classList.toggle('open',open);m.classList.toggle('pop',open);
  p.dataset.s=s;m.dataset.sheet=s;
  if(isMobile()){
    p.style.transition=animate?'':'none';
    const h=sheetH(s);p.style.height=h+'px';m.style.setProperty('--sheet-h',h+'px');
  }else{p.style.height='';p.style.transition='';m.style.setProperty('--sheet-h','0px');}
  $('popen').classList.toggle('show',!open&&panelHidden&&level!=='tw');
}
// 地圖縮放時扣掉面板蓋住的範圍（手機扣下方、電腦扣右側）
function fitTo(b,{pad=20,maxZoom=16}={}){
  if(!b)return;
  const open=sheet!=='closed';
  const br=isMobile()?[pad,(open?sheetH(sheet):0)+pad]:[(open?400:0)+pad,pad];
  map.fitBounds(b,{paddingTopLeft:[pad,pad],paddingBottomRight:br,maxZoom});
}
function keepVisible(b){
  const pt=map.latLngToContainerPoint(b.getCenter()),visH=$('main').clientHeight-sheetH(sheet);
  if(pt.y>visH-40)map.panBy([0,pt.y-visH/2]);
}
$('pclose').onclick=()=>{if(scope&&scope.kind==='li')leaveLi();else{panelHidden=true;setSheet('closed');}};
$('popen').onclick=()=>{if(scope)showScope(scope.kind);};
$('p_head').addEventListener('click',e=>{if(isMobile()&&sheet==='peek'&&!e.target.closest('.x'))setSheet('half');});
addEventListener('resize',()=>setSheet(sheet,{animate:false}));
// 拖曳：抓把手／標題隨時可拖；內容區在頂端往下拉、或還沒全開時往上拉，就拖面板，其餘照常捲動
(function(){
  const p=$('panel'),body=$('p_body');let st=null;
  // from：'head' 把手／標題（立刻可拖）、'filter' 政黨列（左右滑＝捲動政黨，上下滑才拖面板）、'body' 內容區
  function start(e,from){
    if(!isMobile()||sheet==='closed')return;
    const y=e.touches[0].clientY,x=e.touches[0].clientX;
    st={x0:x,y0:y,y,h:p.offsetHeight,from,drag:from==='head',last:y,lt:e.timeStamp,v:0};
    if(st.drag)p.style.transition='none';
  }
  function move(e){
    if(!st)return;
    const y=e.touches[0].clientY,dy=y-st.y0,dx=e.touches[0].clientX-st.x0;
    if(!st.drag){
      if(Math.max(Math.abs(dx),Math.abs(dy))<6)return;
      if(st.from==='filter'){
        if(Math.abs(dx)>Math.abs(dy)){st=null;return;} // 左右滑：交給政黨列自己捲動
        st.drag=true;st.y0=y;st.h=p.offsetHeight;p.style.transition='none';
      }else if((dy<0&&sheet!=='full')||(dy>0&&body.scrollTop<=0)){st.drag=true;st.y0=y;st.h=p.offsetHeight;p.style.transition='none';}
      else{st=null;return;}
    }
    e.preventDefault();
    const H=$('main').clientHeight;
    p.style.height=Math.max(peekH()*.6,Math.min(H,st.h-(y-st.y0)))+'px';
    st.v=(y-st.last)/Math.max(1,e.timeStamp-st.lt);st.last=y;st.lt=e.timeStamp;
  }
  function end(){
    if(!st)return;
    const was=st;st=null;
    if(!was.drag)return;
    p.style.transition='';
    // 快速一甩＝往甩的方向停在下一段；慢慢拖＝停在最近的一段
    const h=p.offsetHeight,hs=['peek','half','full'].map(s=>[s,sheetH(s)]);
    let best;
    if(was.v<-.4)best=(hs.find(([,v])=>v>h+10)||hs[2])[0];
    else if(was.v>.4)best=([...hs].reverse().find(([,v])=>v<h-10)||hs[0])[0];
    else best=hs.sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0];
    setSheet(best);
  }
  [$('p_grab'),$('p_head')].forEach(el=>el.addEventListener('touchstart',e=>start(e,'head'),{passive:true}));
  $('p_filter').addEventListener('touchstart',e=>start(e,'filter'),{passive:true});
  body.addEventListener('touchstart',e=>start(e,'body'),{passive:true});
  p.addEventListener('touchmove',move,{passive:false});
  p.addEventListener('touchend',end);p.addEventListener('touchcancel',end);
})();

// 有號次（c.no）就依號次排序；號次公告前維持原順序
const sortCands=cs=>cs.some(c=>c.no!=null&&c.no!=='')?[...cs].sort((a,b)=>(+a.no||999)-(+b.no||999)):cs;
function partiesHere(){
  const cnt={};
  GROUPS.forEach(g=>g.offices.forEach(o=>officeList(o).forEach(r=>r.cs.forEach(c=>cnt[c.party]=(cnt[c.party]||0)+1))));
  return Object.keys(cnt).sort((a,b)=>(a==='無')-(b==='無')||cnt[b]-cnt[a]);
}
// 政黨篩選：第一次點＝只看這個黨，再點其他黨＝加選，點「全部」＝重置
function renderFilter(){
  const box=$('p_filter'),ps=partiesHere();
  if(ps.length<2){box.innerHTML='';return;}
  box.innerHTML='<span class="pflab">政黨</span>'
    +`<button class="pf${curParties?'':' on'}" data-p="">全部</button>`
    +ps.map(p=>`<button class="pf${curParties?(curParties.has(p)?' on':' dim'):''}" data-p="${esc(p)}"><span class="dot" style="background:${partyColor(p)}"></span>${esc(p)}</button>`).join('');
  box.querySelectorAll('.pf').forEach(el=>el.onclick=()=>{
    const p=el.dataset.p;
    if(!p)curParties=null;
    else if(!curParties)curParties=new Set([p]);
    else{curParties.has(p)?curParties.delete(p):curParties.add(p);if(!curParties.size)curParties=null;}
    renderFilter();renderPanel();
  });
}
const candRow=(c,zn)=>`<div class="cand" data-k="${esc(zn+'|'+c.name)}">${c.no!=null&&c.no!==''?`<div class="no">${esc(c.no)}</div>`:''}<div class="bar" style="background:${partyColor(c.party)}"></div><div><div class="nm">${esc(c.name||'—')}</div>${c.indi?`<div class="zh">${esc(c.indi)}</div>`:''}</div><div class="pt">${esc(c.party)}</div></div>`;
function renderPanel(){
  const isLi=scope.kind==='li',body=$('p_body');
  let html='',shown=0,offices=0,total=0;
  GROUPS.forEach(g=>{
    let gh='',notes='';
    g.offices.forEach(off=>{
      const list=officeList(off);
      if(!list.length){const sp=scope.split[off];if(sp&&!isLi&&!curParties)notes+=splitNote(off,sp.length);return;}
      list.forEach(r=>{
        offices++;total+=r.cs.length;
        let cs=sortCands(r.cs);
        if(curParties)cs=cs.filter(c=>curParties.has(c.party));
        if(curParties&&!cs.length)return;
        shown+=cs.length;
        const it0=curData.indiType[r.zn],it=it0&&!off.includes(it0)?it0:''; // 職務名稱已含身分別就不重複
        const cnt=r.cs.length?(curParties?cs.length+' / '+r.cs.length:r.cs.length)+' 人':'';
        const note=(curData.notes||{})[r.zn]; // 選區備註（停止選舉、重行選舉等）
        const rows=(note?`<div class="note">${esc(note)}</div>`:'')+(cs.map(c=>candRow(c,r.zn)).join('')||(note?'':'<div class="empty">無登記候選人</div>'));
        gh+=`<div class="office"><div class="oh"><span class="ot">${off}${it?' · '+it:''}</span><span class="zone">${esc(r.zn)}</span>${r.partial?'<span class="part">本區部分里</span>':''}<span class="cnt">${cnt}</span></div><div class="ol">${rows}</div></div>`;
      });
    });
    if(gh||notes)html+=`<section class="g" style="--gc:${g.color}"><div class="grp">${g.name}${g.sub?'<small>'+g.sub+'</small>':''}</div>${gh}${notes}</section>`;
  });
  $('p_peek').textContent=`▲ 往上拉查看 ${total} 位候選人`;
  if(!offices)html+='<div class="empty">查無選區資料</div>';
  else if(curParties&&!shown)html+=`<div class="empty">這個${isLi?'里':'範圍'}沒有所選政黨的候選人</div>`;
  if(!isLi){body.innerHTML=html;return;}
  const li=curData.lis[curVc];
  // 投票所（有選鄰就把對應的投票所標出來並置頂）
  const polls=(li.poll||[]).map(p=>({p,r:parseNb(p.nb),mine:false}));
  if(curNb){
    polls.forEach(x=>{if(x.r&&x.r.some(([a,b])=>curNb>=a&&curNb<=b))x.mine=true;});
    if(!polls.some(x=>x.mine)){const all=polls.filter(x=>!x.r);if(all.length===1)all[0].mine=true;}
    polls.sort((a,b)=>b.mine-a.mine);
  }
  html+=`<section class="g" style="--gc:#0f9d8a"><div class="grp">投票所（${polls.length}）</div>`;
  // 有好幾個投票所、而且有鄰別資料 → 讓使用者選自己的鄰，標出該去哪一個投票所
  let maxNb=0;polls.forEach(x=>{if(x.r)x.r.forEach(([,b])=>{if(b>maxNb)maxNb=b;});});
  if(polls.length>1&&maxNb&&maxNb<=300)html+=`<div class="nbsel">我住第 <select id="nbsel"><option value="">—</option>${Array.from({length:maxNb},(_,i)=>`<option value="${i+1}"${curNb===i+1?' selected':''}>${i+1}</option>`).join('')}</select> 鄰，幫我找投票所</div>`;
  if(curNb&&polls.length&&!polls.some(x=>x.mine))html+=`<div class="empty">找不到第 ${curNb} 鄰對應的投票所，請參考下方清單</div>`;
  if(polls.length){
    polls.forEach(({p,mine})=>{
      const nb=p.nb&&!['全里','全村',li.vill].includes(p.nb)?p.nb:'';
      html+=`<a class="poll${mine?' mine':''}" href="${esc(p.map)}" target="_blank" rel="noopener">${mine?`<div class="mineb">⭐ 你的投票所（第 ${curNb} 鄰）</div>`:''}<div class="pn">${esc(p.name)} 📍</div><div class="pa">${esc(p.addr)}</div>${nb?`<div class="pnb">投票鄰別：${esc(nb)}</div>`:''}<div class="pgo">點選開啟 Google 地圖 ↗</div></a>`;
    });
  }else html+='<div class="empty">此里別無獨立投票所（可能與鄰里合併）</div>';
  html+='</section>';
  body.innerHTML=html;
  const ns=$('nbsel');
  if(ns)ns.onchange=()=>{const top=body.scrollTop;curNb=+ns.value||null;renderPanel();body.scrollTop=top;};
}

// ---- 統一搜尋列：地區（縣市／行政區／村里／議員選區）＋候選人 ----
// 索引 data/_search.json 由 build_search_index.mjs 產生，第一次用到搜尋時才下載
// 比對：台／臺通用、忽略空白與間隔號；可以混著打（「台北 龍泉」「大安龍泉」）
const normQ=s=>String(s||'').normalize('NFKC').replace(/台/g,'臺').replace(/[\s·‧．.・･ㆍ'’ʼ＇∙•\-]/g,'').toLowerCase();
const subseq=(q,s)=>{let i=0;for(const ch of s)if(ch===q[i]&&++i===q.length)return true;return false;};
const zoneNoOf=k=>(String(k).match(/第(\d+)選舉區$/)||[])[1];
let SIDX=null,sidxP=null;
function loadIndex(){
  if(!sidxP)sidxP=fetch('data/_search.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{
    const areas=j.a.map(([t,ci,town,name,x])=>{
      const county=j.C[ci];
      if(t===3){const lab=`${county}議員 第${zoneNoOf(name)}選區`;
        return {kind:'area',t,county,key:name,label:lab,sub:'議員選區・'+x,k:normQ(lab),f:normQ(lab+name+x)};}
      const sub=t===0?'縣市':t===1?county:county+town+(x===1?'・新設里':'');
      return {kind:'area',t,county,town,name,label:name,sub,k:normQ(name),f:normQ(county+(t===2?town:'')+(t===0?'':name))};
    });
    const cands=j.k.map(([name,no,pi,ci,oi,z])=>{
      const county=j.C[ci],off=j.O[oi],v=typeof z==='number'?areas[z]:null;
      const town=v?v.town:String(z).replace(/第\d+選舉區$/,''),zk=v?county+v.town+v.name:county+z,n=zoneNoOf(zk);
      const label=({直轄市長:county+'長',縣市長:county+'長',直轄市議員:`${county}議員 第${n}選區`,縣市議員:`${county}議員 第${n}選區`,
        平地原住民議員:county+' 平地原住民議員',山地原住民議員:county+' 山地原住民議員',鄉鎮市長:`${county} ${town}長`,山地原住民區長:`${county} ${town}長`,
        鄉鎮市民代表:`${county} ${town}民代表 第${n}選區`,山地原住民區民代表:`${county} ${town}民代表 第${n}選區`,平地原住民代表:`${county} ${town}平地原住民代表`,
        村里長:v?`${county}${v.town} ${v.name}長`:zk})[off]||zk;
      return {kind:'cand',name,no,party:j.P[pi],county,off,zk,town,label,k:normQ(name),f:normQ(name+label)};
    });
    // 原住民議員：同縣市有好幾個選區才標「第N選區」
    const nz={};cands.forEach(c=>{if(/原住民議員/.test(c.off))(nz[c.county+c.off]||=new Set()).add(c.zk);});
    cands.forEach(c=>{if(nz[c.county+c.off]&&nz[c.county+c.off].size>1){c.label+=` 第${zoneNoOf(c.zk)}選區`;c.f=normQ(c.name+c.label);}});
    const townsBy={},villsBy={};
    areas.forEach(a=>{if(a.t===1)(townsBy[a.county]||=[]).push(a.town);else if(a.t===2)(villsBy[a.county+a.town]||=[]).push(a.name);});
    Object.values(townsBy).concat(Object.values(villsBy)).forEach(l=>l.sort((a,b)=>b.length-a.length)); // 長的先比，避免短名吃掉長名
    return SIDX={areas,cands,counties:j.C,townsBy,villsBy};
  }).catch(e=>{sidxP=null;throw e;});
  return sidxP;
}
// 名稱完全相同 > 開頭相同 > 包含 > 連同縣市、職稱一起比對 > 拆成幾段都比對得到 > 地區可跳字（大安龍泉）
function scoreOf(it,nq,toks){
  const k=it.k,f=it.f;
  if(k===nq)return 100;if(k.startsWith(nq))return 85;if(k.includes(nq))return 70;
  if(f.includes(nq))return 55;
  if(toks.length>1&&toks.every(t=>f.includes(t)))return 50;
  if(it.kind==='area'&&nq.length>=3&&subseq(nq,f))return 30;
  return 0;
}
function runSearch(q){
  const nq=normQ(q);if(!nq||!SIDX)return null;
  const toks=String(q).normalize('NFKC').replace(/台/g,'臺').split(/\s+/).map(normQ).filter(Boolean);
  const pick=(arr,max,tie)=>{const r=[];for(const it of arr){const s=scoreOf(it,nq,toks);if(s)r.push([s,it]);}r.sort((a,b)=>b[0]-a[0]||tie(a[1],b[1]));return {list:r.slice(0,max).map(x=>x[1]),total:r.length};};
  return {
    areas:pick(SIDX.areas,8,(a,b)=>a.t-b.t||a.f.length-b.f.length),
    cands:pick(SIDX.cands,20,(a,b)=>(a.no==null)-(b.no==null)),
  };
}
// ---- 戶籍地址 → 里、鄰（身分證背面的地址有寫里鄰；投票所正是依戶籍的里鄰分配，不需要地址定位服務）----
// 支援：郵遞區號、台／臺、舊縣名（臺北縣→新北市等）、升格前的鄉鎮名（板橋市→板橋區）、村／里互換、國字鄰（五鄰、十二鄰）
const OLD_COUNTY={臺北縣:'新北市',桃園縣:'桃園市',臺中縣:'臺中市',臺南縣:'臺南市',高雄縣:'高雄市'};
const RIS_URL='https://www.ris.gov.tw/app/portal/3053';
function cnNum(t){
  if(/^\d+$/.test(t))return +t;
  const d={零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};let n=0,cur=0;
  for(const ch of t){if(ch in d)cur=d[ch];else if(ch==='十'){n+=(cur||1)*10;cur=0;}else if(ch==='百'){n+=(cur||1)*100;cur=0;}else return NaN;}
  return n+cur;
}
function matchName(list,rest,suf){ // 名稱完全相同，或去掉最後一字後接上舊的字尾（板橋市→板橋區、XX村→XX里）
  for(const x of list){
    if(rest.startsWith(x))return {name:x,rest:rest.slice(x.length)};
    const b=x.slice(0,-1);
    if(b.length>=(suf==='里村'?1:2)&&rest.startsWith(b)&&suf.includes(rest[b.length]))return {name:x,rest:rest.slice(b.length+1)};
  }
  return null;
}
function parseAddr(q){
  let s=String(q).normalize('NFKC').replace(/台/g,'臺').replace(/[\s,，]/g,'').replace(/^\d{3,6}/,'');
  for(const [o,n] of Object.entries(OLD_COUNTY))if(s.startsWith(o)){s=n+s.slice(o.length);break;}
  if(!/[路街道巷弄號鄰段]/.test(s))return []; // 看起來像地址才解析
  const tries=[];
  for(const c of SIDX.counties){
    const other=c.slice(0,2)+(c.endsWith('市')?'縣':'市');
    if(s.startsWith(c))tries.push([c,s.slice(c.length)]);
    else if(s.startsWith(c.slice(0,2))&&!s.startsWith(other))tries.push([c,s.slice(2)]);
  }
  if(!tries.length)SIDX.counties.forEach(c=>tries.push([c,s])); // 沒寫縣市：每個縣市都試
  const out=[];
  for(const [c,rest] of tries){
    const t=matchName(SIDX.townsBy[c]||[],rest,'市鄉鎮區');if(!t)continue;
    const r={kind:'addr',county:c,town:t.name};
    const v=matchName(SIDX.villsBy[c+t.name]||[],t.rest,'里村');
    if(v){r.vill=v.name;const m=v.rest.match(/^(\d+|[零〇一二兩三四五六七八九十百]+)鄰/);if(m&&cnNum(m[1])>0)r.nb=cnNum(m[1]);}
    out.push(r);
  }
  // 有對到里的優先；沒寫縣市又對到好幾個同名行政區時，全部列出讓使用者選
  const withV=out.filter(r=>r.vill);
  return (withV.length?withV:out).slice(0,4);
}
let sShown=[],sAct=-1,sTimer=null;
function renderResults(){
  const q=$('q').value,ul=$('qres');
  if(!normQ(q)){sShown=[];ul.innerHTML='';return;}
  if(!SIDX){ul.innerHTML='<li class="tip">搜尋資料載入中…</li>';loadIndex().then(renderResults,()=>{ul.innerHTML='<li class="tip">搜尋資料載入失敗，請重新整理再試</li>';});return;}
  const r=runSearch(q);sShown=[];let h='';
  const addrs=parseAddr(q);
  if(addrs.length){
    h+='<li class="sh">🏠 戶籍地址</li>';
    addrs.forEach(a=>{
      const lab=a.county+a.town+(a.vill||'')+(a.nb?` 第${a.nb}鄰`:'');
      const sub=a.nb?'標出你的投票所':a.vill?'地址沒有寫鄰，列出這個里所有投票所':'地址沒有寫里別，無法判斷是哪個里';
      h+=`<li data-i="${sShown.length}" role="option"><span class="sn">${esc(lab)}</span><small>${sub}</small></li>`;sShown.push(a);
    });
    if(!addrs.some(a=>a.vill))h+=`<li class="tip">請看身分證背面戶籍地址裡的「里、鄰」，或到內政部戶政司 <a href="${RIS_URL}" target="_blank" rel="noopener">門牌查詢</a> 用門牌查里鄰</li>`;
  }
  const more=(g,n)=>g.total>n?`<li class="more">還有 ${g.total-n} 筆，請輸入更完整的名稱</li>`:'';
  if(r.areas.list.length){h+='<li class="sh">📍 地區</li>';r.areas.list.forEach(it=>{h+=`<li data-i="${sShown.length}" role="option"><span class="sn">${esc(it.label)}</span><small>${esc(it.sub)}</small></li>`;sShown.push(it);});h+=more(r.areas,r.areas.list.length);}
  if(r.cands.list.length){h+='<li class="sh">👤 候選人</li>';r.cands.list.forEach(it=>{h+=`<li data-i="${sShown.length}" role="option">${it.no!=null?`<span class="sno">${esc(it.no)}</span>`:''}<span class="sdot" style="background:${partyColor(it.party)}"></span><span class="sn">${esc(it.name)}</span><small>${esc(it.label)}・${esc(it.party)}</small></li>`;sShown.push(it);});h+=more(r.cands,r.cands.list.length);}
  ul.innerHTML=h||'<li class="tip">找不到符合的候選人或地區</li>';
  sAct=sShown.length?0:-1;markAct();
}
function markAct(){
  const ul=$('qres');ul.querySelectorAll('li[data-i]').forEach(li=>li.classList.toggle('act',+li.dataset.i===sAct));
  const el=ul.querySelector('li.act');if(el){const t=el.offsetTop,b=t+el.offsetHeight;if(t<ul.scrollTop)ul.scrollTop=t;else if(b>ul.scrollTop+ul.clientHeight)ul.scrollTop=b-ul.clientHeight;}
}
function openSearch(){
  const box=$('sbox');box.classList.add('show','open');$('q').setAttribute('aria-expanded','true');
  renderResults();loadIndex().catch(()=>{});hideHint();
  if(!isMobile()||document.activeElement!==$('q'))$('q').focus({preventScroll:true});
}
function closeSearch(){
  const box=$('sbox');box.classList.remove('open');$('q').setAttribute('aria-expanded','false');
  if(isMobile())box.classList.remove('show');
  if(document.activeElement===$('q'))$('q').blur();
}
function initSearch(){
  const q=$('q');
  // 聚焦、點擊、打字都會打開結果清單（不只靠 focus 事件，有些瀏覽器不一定觸發）
  const openDrop=()=>{if(!$('sbox').classList.contains('open')){$('sbox').classList.add('open');q.setAttribute('aria-expanded','true');renderResults();}loadIndex().catch(()=>{});};
  q.addEventListener('focus',()=>{q.select();openDrop();});
  q.addEventListener('click',openDrop);
  // 中文輸入法選字中不搜尋，選完字（compositionend）才搜
  const later=()=>{clearTimeout(sTimer);sTimer=setTimeout(renderResults,80);};
  q.addEventListener('input',e=>{openDrop();if(!e.isComposing)later();});
  q.addEventListener('compositionend',later);
  q.addEventListener('keydown',e=>{
    if(e.isComposing)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=sShown.length;if(!n)return;sAct=(sAct+(e.key==='ArrowDown'?1:-1)+n)%n;markAct();}
    else if(e.key==='Enter'){e.preventDefault();if(sShown[sAct])pickResult(sShown[sAct]);}
    else if(e.key==='Escape')closeSearch();
  });
  const ul=$('qres');
  ul.addEventListener('mousedown',e=>e.preventDefault()); // 點清單時不讓輸入框失焦
  ul.addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li)pickResult(sShown[+li.dataset.i]);});
  $('qclose').onclick=closeSearch;
  $('sbtn').onclick=e=>{e.stopPropagation();$('sbox').classList.contains('show')?closeSearch():openSearch();};
  // 點搜尋框以外的地方就收起來
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#sbox')&&!e.target.closest('#sbtn'))closeSearch();});
}

// 選到搜尋結果：地圖跳到該範圍，面板顯示該範圍的候選人
async function pickResult(it){
  $('q').value=it.kind==='cand'?it.name:it.kind==='addr'?$('q').value:it.label;
  closeSearch();
  const full=it.t===0||(it.kind==='cand'&&/^(直轄市長|縣市長)$/.test(it.off));
  if(it.kind==='cand'&&isMobile())sheetWant=sheet==='full'?'full':'half';
  try{await pickGo(it,full);}finally{sheetWant=null;}
}
async function pickGo(it,full){
  if(!(await openCounty(it.county,{fit:full})))return;
  const lis=curData.lis,vcOf=(off,zk)=>Object.keys(lis).find(vc=>(lis[vc].zones||{})[off]===zk);
  if(it.kind==='addr'){
    const vc=it.vill&&Object.keys(lis).find(vc=>lis[vc].town===it.town&&lis[vc].vill===it.vill);
    if(vc)openLi(vc,{fit:true,nb:it.nb||null});else selectTown(it.town);
    // 有鄰：面板直接捲到「你的投票所」
    if(vc&&it.nb)setTimeout(()=>{const el=document.querySelector('.poll.mine'),body=$('p_body');if(el)body.scrollTop=Math.max(0,el.offsetTop-body.offsetTop-60);},320);
    return;
  }
  if(it.kind==='area'){
    if(it.t===1)selectTown(it.town);
    else if(it.t===2){const vc=Object.keys(lis).find(vc=>lis[vc].town===it.town&&lis[vc].vill===it.name);if(vc)openLi(vc,{fit:true});}
    else if(it.t===3)showZone(Object.values(lis).some(l=>(l.zones||{})['直轄市議員']===it.key)?'直轄市議員':'縣市議員',it.key);
    return;
  }
  // 候選人：縣市長＝縣市；鄉鎮市長＝行政區；村里長＝該里；其餘（議員、代表、原住民議員）＝選區範圍
  const off=it.off,zk=it.zk;
  if(/^(直轄市長|縣市長)$/.test(off)){}
  else if(/鄉鎮市長|區長/.test(off)){const vc=vcOf(off,zk);if(vc)selectTown(lis[vc].town);}
  else if(off==='村里長'){const vc=vcOf(off,zk);if(vc)openLi(vc,{fit:true});}
  else showZone(off,zk);
  highlightCand(zk,it.name);
}
// 面板裡找到搜尋的那位候選人：捲過去並短暫標亮
function highlightCand(zk,name){
  setTimeout(()=>{
    const el=[...$('p_body').querySelectorAll('.cand')].find(e=>e.dataset.k===zk+'|'+name);if(!el)return;
    const body=$('p_body');body.scrollTop=Math.max(0,el.offsetTop-body.offsetTop-body.clientHeight/3);
    el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');
  },320);
}

// ---- 選區範圍（搜尋議員、代表時）：地圖描出選區外框，面板列出選區內各層候選人 ----
let curZone=null,zoneLayer=null;
function clearZone(){curZone=null;if(zoneLayer){map.removeLayer(zoneLayer);zoneLayer=null;}}
function zoneTitle(z){
  const n=zoneNoOf(z.key),t=z.towns[0];
  if(COUNCIL.has(z.off))return `${curCounty}議員 第${n}選區`;
  if(/原住民議員/.test(z.off)){const all=new Set(Object.values(curData.lis).map(l=>(l.zones||{})[z.off]).filter(Boolean));return `${curCounty} ${z.off}`+(all.size>1?` 第${n}選區`:'');}
  if(z.off==='平地原住民代表')return `${t}平地原住民代表`;
  if(/代表/.test(z.off))return `${t}民代表 第${n}選區`;
  return z.key;
}
function showZone(off,key){
  const vcs=Object.keys(curData.lis).filter(vc=>(curData.lis[vc].zones||{})[off]===key);
  if(!vcs.length)return;
  const towns=[...new Set(vcs.map(vc=>curData.lis[vc].town))];
  if(towns.length===1)selectTown(towns[0],{fit:false});else backToCounty({fit:false});
  curZone={off,key,vcs,towns};
  const topo=curData.boundary,set=new Set(vcs),gs=topo.objects.lis.geometries.filter(g=>set.has(g.properties.vc));
  if(gs.length)zoneLayer=L.geoJSON(topojson.merge(topo,gs),{pane:'pZone',interactive:false,style:{color:'#1a1f2b',weight:4,opacity:.9,fill:false}}).addTo(map);
  updateCrumb();showScope('zone');
  const b=zoneLayer?coreBounds(zoneLayer.toGeoJSON())||zoneLayer.getBounds():towns.length===1?townBounds(towns[0]):null;
  fitTo(b,{pad:30});
  hideHint();
}

// 滑鼠滾輪可以左右捲動按鈕列
document.querySelectorAll('.chips').forEach(el=>el.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){el.scrollLeft+=e.deltaY;e.preventDefault();}
},{passive:false}));

// ---- 選舉倒數（以台北時間計算；最後 7 天變橘紅，投票日當天與結束後換文字）----
const VOTE_DAY=Date.UTC(2026,10,28),VOTE_END_H=16;
function renderCountdown(){
  const now=new Date(),p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(now).map(x=>[x.type,x.value]));
  const days=Math.round((VOTE_DAY-Date.UTC(+p.year,p.month-1,+p.day))/864e5);
  const done=days<0||(days===0&&+p.hour>=VOTE_END_H);
  const txt=done?'投票已結束':days===0?'今天投票！':`倒數<b>${days}</b>天`;
  // 頂部標題列（電腦）與地圖右上角（手機）各一個
  document.querySelectorAll('.cd').forEach(el=>{
    ['done','hot'].forEach(c=>el.classList.toggle(c,c==='done'?done:!done&&days<=7));
    el.innerHTML=txt+'<span class="cdtip">投票日：11/28（六）08:00–16:00<br>記得帶身分證、印章、投票通知單</span>';
  });
}
renderCountdown();setInterval(renderCountdown,60000);
document.querySelectorAll('.cd').forEach(el=>el.onclick=e=>{e.stopPropagation();el.classList.toggle('open');});
document.addEventListener('click',()=>document.querySelectorAll('.cd').forEach(el=>el.classList.remove('open')));

init();
</script>
</body>
</html>
